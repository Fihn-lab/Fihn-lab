# site properties and page defaults
title: 
subtitle: Exploring Microbial Communication
description: We study how pathogenic bacteria communicate using small molecules, focusing on PQS signaling in Pseudomonas aeruginosa. By engineering biosynthetic pathways to generate new PQS analogs and integrating microbiology, chemical biology, and mass spectrometry, we aim to understand and disrupt the signals that control virulence.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: contact@Fihn-lab.com
  orcid: 0000-0002-9253-1479
  google-scholar: tLmiPMYAAAAJ
  github: Fihn-lab
  bluesky: cradaf.bsky.social
  youtube: Fihn-lab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
