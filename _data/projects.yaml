- title: Engineering New Quorum Sensing Molecules Through Biosynthesis
  subtitle: 
  group: featured
  image: images/project1.png
  link: https://fihn-lab.github.io/Fihn-lab/projects/biosynthesis/
  description: Current work in the lab focuses on expanding the chemical diversity of Pseudomonas Quinolone Signal (PQS), a small molecule used by Pseudomonas aeruginosa to communicate and coordinate group behaviors such as biofilm formation and virulence. By feeding the bacteria modified precursor molecules, we can encourage the biosynthesis of new PQS analogs with altered structures and potentially altered biological activity. New molecules are identified using liquid chromatography–mass spectrometry (LC–MS), and their structures are further characterized through fragmentation analysis, purification, and NMR spectroscopy. This work explores how bacterial biosynthetic pathways can be redirected to generate entirely new signaling molecules that are not normally produced in nature. Beyond studying PQS itself, this approach provides a broader framework for engineering microbial metabolism to access new chemical space through biosynthesis rather than traditional synthetic chemistry alone. Understanding how structural changes alter signaling activity also helps reveal the molecular features that control bacterial communication, group behavior, and pathogenicity. In the long term, these studies may enable the development of new chemical tools for probing quorum sensing networks and lay the groundwork for antivirulence strategies that disrupt bacterial behavior without directly killing the bacteria, potentially reducing selective pressure for antibiotic resistance. 
  repo: greenelab/lab-website-template
  tags:
    - resource

- title: Functional Modulation of Quorum Sensing and Virulence
  subtitle: a subtitle
  group: featured
  image: images/virulence.png
  link: 
  description: A second major focus of the lab is understanding how modified quorum sensing molecules influence bacterial behavior and virulence. Using both precursor analogs and biosynthetically generated PQS analogs, we investigate how structural changes to these molecules affect processes such as biofilm formation, motility, and production of virulence-associated factors in Pseudomonas aeruginosa. These studies aim to determine whether altered signaling molecules can interfere with normal quorum sensing pathways, weaken bacterial coordination, or selectively modulate virulence-related behaviors. Because quorum sensing controls many pathogenic traits without being directly required for bacterial survival, disrupting these signaling pathways represents a promising antivirulence strategy. Rather than killing bacteria outright, this approach seeks to reduce their ability to establish infections and cause disease, which may help minimize the evolutionary pressure that drives antibiotic resistance. More broadly, this work contributes to understanding how small molecules shape microbial community behavior and how engineered signaling analogs can be used to reprogram or disrupt bacterial communication networks.
  repo: greenelab/lab-website-template
  tags:
    - resource


