  description: Current work in the lab focuses on creating new variants of Pseudomonas Quinolone Signal (PQS), a small molecule used by Pseudomonas aeruginosa to communicate and coordinate group behaviors such as biofilm formation and virulence. By feeding the bacteria modified precursor molecules, we can encourage the production of new PQS analogs with altered structures and potentially altered biological activity.

  New molecules are identified using liquid chromatography–mass spectrometry (LC–MS), and their structures are further studied using fragmentation analysis, purification, and NMR spectroscopy. This work helps us better understand how small changes in signaling molecules affect bacterial communication and behavior.

  Because quorum sensing plays an important role in regulating virulence in P. aeruginosa, developing new PQS analogs may provide new tools for studying bacterial signaling and could eventually help identify compounds capable of reducing harmful bacterial behaviors without directly killing the bacteria. This type of antivirulence approach may help reduce selective pressure for antibiotic resistance while offering new strategies for controlling bacterial infections. 
